<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>todos · cf-gleam</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f5f2;
        --card: #ffffff;
        --text: #1d1b16;
        --muted: #77736a;
        --line: #e7e4dd;
        --accent: #ffaff3;
        --accent-strong: #c2389f;
        --danger: #c0392b;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15141a;
          --card: #1f1d26;
          --text: #ece9f2;
          --muted: #8f8a9c;
          --line: #2f2c38;
          --accent-strong: #ffaff3;
          --danger: #ff7b6b;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); }
      .app { max-width: 34rem; margin: 3rem auto; padding: 0 1rem; }
      header { display: flex; align-items: baseline; justify-content: space-between; }
      h1 { margin: 0; font-size: 2.5rem; letter-spacing: -0.04em; }
      .tagline { margin: 0.25rem 0 1.5rem; color: var(--muted); font-size: 0.9rem; }
      .connection { font-size: 0.75rem; padding: 0.15rem 0.6rem; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
      .connection::before { content: "●"; margin-right: 0.35rem; }
      .connection.online::before { color: #2ecc71; }
      .connection.connecting::before { color: #f1c40f; }
      .connection.offline::before { color: var(--danger); }
      .error { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.6rem 0.9rem; margin-bottom: 0.75rem; border-radius: 0.6rem; background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); font-size: 0.9rem; }
      .new-todo { width: 100%; padding: 0.9rem 1rem; font: inherit; font-size: 1.05rem; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 0.75rem; outline: none; }
      .new-todo:focus { border-color: var(--accent-strong); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
      .todos { list-style: none; margin: 1rem 0 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 0.75rem; overflow: hidden; }
      .todos:empty { display: none; }
      .todos li { display: flex; align-items: center; justify-content: space-between; padding: 0.7rem 0.9rem; border-top: 1px solid var(--line); }
      .todos li:first-child { border-top: none; }
      .todos label { display: flex; align-items: center; gap: 0.75rem; flex: 1; cursor: pointer; overflow-wrap: anywhere; }
      .todos input[type="checkbox"] { width: 1.15rem; height: 1.15rem; accent-color: var(--accent-strong); }
      .todos li.done span { color: var(--muted); text-decoration: line-through; }
      .delete { border: none; background: none; color: var(--muted); font-size: 1.3rem; line-height: 1; cursor: pointer; opacity: 0; padding: 0 0.25rem; }
      .todos li:hover .delete, .delete:focus-visible { opacity: 1; }
      @media (hover: none) { .delete { opacity: 1; } }
      .delete:hover { color: var(--danger); }
      footer { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin-top: 0.75rem; color: var(--muted); font-size: 0.85rem; }
      .filters { display: flex; gap: 0.25rem; }
      .link { border: none; background: none; color: inherit; font: inherit; cursor: pointer; padding: 0.2rem 0.5rem; border-radius: 0.4rem; }
      .link:hover:not(:disabled) { color: var(--text); }
      .link.selected { color: var(--text); background: var(--line); }
      .link:disabled { opacity: 0.4; cursor: default; }
      .empty { text-align: center; color: var(--muted); margin-top: 2rem; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
