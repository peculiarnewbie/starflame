<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>chat · starflame</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1013;
        --panel: #15181d;
        --line: #262b33;
        --text: #e9edf3;
        --muted: #8b94a3;
        --accent: #8ad0a8;
        --danger: #ff8b7d;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; background: var(--bg); color: var(--text); }
      .app { max-width: 44rem; height: 100dvh; margin: 0 auto; padding: 1.25rem 1rem; display: flex; flex-direction: column; gap: 0.9rem; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
      .brand { display: flex; align-items: baseline; gap: 0.6rem; }
      h1 { margin: 0; font-size: 1.35rem; letter-spacing: -0.02em; }
      .online { color: var(--muted); font-size: 0.8rem; }
      .connection { font-size: 0.72rem; padding: 0.2rem 0.6rem; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
      .connection::before { content: "●"; margin-right: 0.35rem; }
      .connection.online::before { color: var(--accent); }
      .connection.offline::before { color: var(--danger); }

      .error { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.5rem 0.8rem; border-radius: 0.55rem; background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); font-size: 0.85rem; }
      .link { border: none; background: none; color: inherit; font: inherit; cursor: pointer; text-decoration: underline; }

      .join { margin-top: 2.5rem; max-width: 26rem; }
      .tagline { color: var(--muted); line-height: 1.5; }
      .join form { display: flex; gap: 0.5rem; margin-top: 1rem; }
      .field { flex: 1; min-width: 0; padding: 0.7rem 0.9rem; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 0.6rem; outline: none; }
      .field:focus { border-color: var(--accent); }
      .btn { padding: 0.6rem 1rem; font: inherit; font-weight: 600; color: var(--text); background: rgba(255,255,255,0.07); border: 1px solid var(--line); border-radius: 0.55rem; cursor: pointer; }
      .btn:hover:not(:disabled) { background: rgba(255,255,255,0.14); }
      .btn:disabled { opacity: 0.4; cursor: default; }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #07130c; }

      .chat { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 0.8rem; }
      .messages { flex: 1; overflow-y: auto; padding: 0.2rem; display: flex; flex-direction: column; gap: 0.6rem; }
      .message { background: var(--panel); border: 1px solid var(--line); border-radius: 0.7rem; padding: 0.55rem 0.75rem; }
      .message-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.8rem; }
      .author { font-weight: 600; font-size: 0.85rem; color: var(--accent); }
      .time { color: var(--muted); font-size: 0.72rem; font-variant-numeric: tabular-nums; }
      .body { margin: 0.25rem 0 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.4; }
      .empty { color: var(--muted); text-align: center; margin-top: 3rem; }
      .composer { display: flex; gap: 0.5rem; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
