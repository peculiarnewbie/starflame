<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>photos · starflame</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101114;
        --card: #191b20;
        --line: #2a2d35;
        --text: #eceef2;
        --muted: #9096a2;
        --accent: #7cc4ff;
        --danger: #ff8b7d;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
      .app { max-width: 60rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
      header { display: flex; align-items: baseline; justify-content: space-between; }
      .brand { display: flex; align-items: baseline; gap: 0.7rem; }
      h1 { margin: 0; font-size: 1.7rem; letter-spacing: -0.03em; }
      .count { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }

      .error { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-top: 1rem; padding: 0.6rem 0.9rem; border-radius: 0.6rem; background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); font-size: 0.9rem; }
      .link { border: none; background: none; color: inherit; font: inherit; cursor: pointer; text-decoration: underline; }

      .upload { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin-top: 1.5rem; padding: 1rem; border: 1px dashed var(--line); border-radius: 0.8rem; background: var(--card); }
      .file { flex: 1; min-width: 12rem; color: var(--muted); font-size: 0.9rem; }
      .file::file-selector-button { margin-right: 0.8rem; padding: 0.45rem 0.8rem; font: inherit; color: var(--text); background: rgba(255,255,255,0.08); border: 1px solid var(--line); border-radius: 0.45rem; cursor: pointer; }
      .hint { margin: 0.7rem 0 0; color: var(--muted); font-size: 0.8rem; }

      .btn { padding: 0.5rem 0.9rem; font: inherit; font-weight: 600; color: var(--text); background: rgba(255,255,255,0.08); border: 1px solid var(--line); border-radius: 0.5rem; cursor: pointer; }
      .btn:hover:not(:disabled) { background: rgba(255,255,255,0.15); }
      .btn:disabled { opacity: 0.4; cursor: default; }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #07131d; }

      .empty { margin-top: 3rem; color: var(--muted); text-align: center; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); gap: 1rem; margin-top: 1.5rem; }
      .card { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 0.8rem; overflow: hidden; }
      .thumb { aspect-ratio: 4 / 3; background: #0b0c0f; display: flex; align-items: center; justify-content: center; }
      .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
      figcaption { padding: 0.7rem 0.8rem 0.8rem; }
      .meta { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
      .name { font-weight: 600; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .size { color: var(--muted); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
      .row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; margin-top: 0.6rem; }
      .badge { padding: 0.1rem 0.45rem; border-radius: 999px; border: 1px solid var(--line); color: var(--accent); font-size: 0.7rem; }
      .roundtrip { display: block; margin-top: 0.5rem; color: var(--muted); font-size: 0.72rem; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
