name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: erlef/setup-beam@v1
        with:
          otp-version: false
          gleam-version: '1.18.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @starflame/example-todo exec playwright install --with-deps chromium
      - name: Check todo routes and synchronization
        shell: bash
        run: |
          pnpm dev > /tmp/starflame-dev.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" || true; cat /tmp/starflame-dev.log' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:5173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:5173/ > /dev/null
          pnpm smoke
          pnpm test:compare
  # The examples are path dependencies in this workspace and are edited
  # alongside the framework. This job consumes the framework the way an app
  # outside the repository would: Git-installed Gleam packages and a packed
  # Vite plugin, with production bundling and generated RPC round trips.
  external:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: false
          gleam-version: '1.18.1'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Build and run an app outside the repository
        run: pnpm test:external
